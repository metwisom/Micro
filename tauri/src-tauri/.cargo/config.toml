# Build for the x86-64-v2 microarchitecture level (SSE4.2/POPCNT — Intel Nehalem 2008+, AMD
# Bulldozer 2011+). This is safe on essentially every 64-bit PC still in use, so shipped binaries
# don't SIGILL ("illegal instruction") at launch on older hardware, while still letting LLVM
# auto-vectorise the DSP (RNNoise + the resampler/limiter glue) beyond the generic baseline.
# Scoped to x86_64 triples so aarch64 (Apple Silicon, ARM) builds are unaffected.
#
# For a faster machine-specific build, "x86-64-v3" (AVX2/FMA, Haswell 2013+) or "native" squeeze
# out more — but neither is portable, so keep those out of release artifacts.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]
